services:
  - type: web
    name: agentvault-api-free
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENV
        value: prod
      - key: FREE_TIER_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: RECEIPT_SIGNING_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LOG_FORMAT
        value: json
      - key: AUDIT_LOG_ENABLED
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
