# ESAKIP Production Nginx Config
# Used behind an AWS ALB (which terminates TLS) or standalone with certbot.
# If behind ALB: ALB handles TLS → port 80 here. HSTS is added by ALB.
# If standalone: uncomment the TLS block and use certbot for Let's Encrypt.

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/s;

upstream esakip_api {
    server api:8000;
    keepalive 16;
}

upstream esakip_frontend {
    server frontend:3000;
    keepalive 8;
}

# --- Redirect HTTP → HTTPS (standalone TLS only, not behind ALB) ---
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # For standalone TLS, change to:
    # listen 443 ssl http2;
    server_name _;

    # --- TLS (standalone, uncomment if not behind ALB) ---
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    client_max_body_size 30m;

    # --- Security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    # --- WAF-like blocks (basic, supplement with AWS WAF) ---
    # Block common attack patterns
    location ~* \.(env|git|svn|bak|old|tmp|swp)$ {
        return 404;
    }

    # --- API routes → FastAPI backend ---
    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://esakip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Login rate limiting (stricter) ---
    location /api/v1/auth/login {
        limit_req zone=login_per_ip burst=5 nodelay;
        proxy_pass http://esakip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSE streaming — disable buffering ---
    location /api/v1/query/stream {
        limit_req zone=api_per_ip burst=10 nodelay;
        proxy_pass http://esakip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- Health check (ALB target group) ---
    location = /ready {
        access_log off;
        proxy_pass http://esakip_api;
    }

    # --- Static assets caching ---
    location /_next/static/ {
        proxy_pass http://esakip_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Everything else → Next.js frontend ---
    location / {
        proxy_pass http://esakip_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
