limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

upstream esakip_api {
    server api:8000;
    keepalive 16;
}

upstream esakip_frontend {
    server frontend:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;          # keep >= MAX_UPLOAD_MB

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # In production terminate TLS here (or at the ALB) and add:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # API routes → FastAPI backend
    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://esakip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # LLM calls can be slow
    }

    # SSE streaming — disable buffering for real-time events
    location /api/v1/query/stream {
        limit_req zone=api_per_ip burst=10 nodelay;
        proxy_pass http://esakip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check
    location = /ready { access_log off; proxy_pass http://esakip_api; }

    # Everything else → Next.js frontend
    location / {
        proxy_pass http://esakip_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
