# Development stack: API + worker + PostgreSQL + Redis + Qdrant + MinIO (S3-compatible) + Nginx.
#   cp .env.example .env && docker compose up --build
services:
  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://esakip:esakip@postgres:5432/esakip
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: esakip-documents
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    volumes:
      - connector_data:/srv/data/connector_root
    expose: ["8000"]

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://esakip:esakip@postgres:5432/esakip
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: esakip-documents
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      SCHEDULER_ENABLED: "false"
    command: ["python", "scripts/worker.py"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    volumes:
      - connector_data:/srv/data/connector_root

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # In Docker, the frontend talks to the API via the nginx reverse proxy
      NEXT_PUBLIC_API_URL: ""
    depends_on: [api]
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, frontend]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: esakip
      POSTGRES_PASSWORD: esakip
      POSTGRES_DB: esakip
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esakip"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9001:9001"]
    volumes: [minio_data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/esakip-documents; exit 0"

volumes:
  pg_data:
  qdrant_data:
  minio_data:
  connector_data:
