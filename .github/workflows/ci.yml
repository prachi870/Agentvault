name: CI
on:
  push: {}
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: esakip, POSTGRES_PASSWORD: esakip, POSTGRES_DB: esakip_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U esakip" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt "moto[s3]"
      - name: Unit + API tests (SQLite / embedded Qdrant)
        run: python -m pytest
      - name: Integration tests (PostgreSQL + Redis + Qdrant server)
        env:
          TEST_DATABASE_URL: postgresql://esakip:esakip@localhost:5432/esakip_test
          TEST_REDIS_URL: redis://localhost:6379/0
          TEST_QDRANT_URL: http://localhost:6333
        run: python -m pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t esakip-api:${{ github.sha }} backend
      - run: docker build -t esakip-frontend:${{ github.sha }} frontend
