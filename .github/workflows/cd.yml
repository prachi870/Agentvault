name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'esakip-prod' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account and ECR registry
        id: aws-account
        shell: bash
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "registry=$account_id.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fill AWS account and region placeholders
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-account.outputs.account_id }}
        run: |
          sed -i "s/ACCOUNT_ID/${AWS_ACCOUNT_ID}/g; s/REGION/${AWS_REGION}/g" \
            deploy/ecs/api-task-definition.json \
            deploy/ecs/frontend-task-definition.json \
            deploy/ecs/worker-task-definition.json

      - name: Resolve Secrets Manager ARNs
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            SECRET_KEY:secret-key \
            RECEIPT_SIGNING_KEY:receipt-signing-key \
            DATABASE_URL:database-url \
            REDIS_URL:redis-url \
            QDRANT_URL:qdrant-url \
            QDRANT_API_KEY:qdrant-api-key \
            GOOGLE_API_KEY:google-api-key; do
            variable=${pair%%:*}
            secret_name=${pair#*:}
            secret_arn=$(aws secretsmanager describe-secret \
              --secret-id "esakip/prod/$secret_name" \
              --query ARN --output text)
            if [[ -z "$secret_arn" || "$secret_arn" == "None" ]]; then
              echo "Missing Secrets Manager entry: esakip/prod/$secret_name"
              exit 1
            fi
            for definition in deploy/ecs/api-task-definition.json deploy/ecs/worker-task-definition.json; do
              sed -i "s|SECRET_ARN_${variable}|${secret_arn}|g" "$definition"
            done
          done

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.aws-account.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/esakip-api:$IMAGE_TAG" -t "$ECR_REGISTRY/esakip-api:latest" backend
          docker push "$ECR_REGISTRY/esakip-api:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/esakip-api:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.aws-account.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/esakip-frontend:$IMAGE_TAG" -t "$ECR_REGISTRY/esakip-frontend:latest" frontend
          docker push "$ECR_REGISTRY/esakip-frontend:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/esakip-frontend:latest"

      - name: Render API task definition
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/api-task-definition.json
          container-name: api
          image: ${{ steps.aws-account.outputs.registry }}/esakip-api:${{ env.IMAGE_TAG }}

      - name: Run database migrations
        env:
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
          API_TASK_DEFINITION: ${{ steps.api-task-def.outputs.task-definition }}
        shell: bash
        run: |
          set -euo pipefail
          network_configuration=$(jq -cn \
            --arg subnets "$ECS_SUBNETS" \
            --arg groups "$ECS_SECURITY_GROUPS" \
            '{awsvpcConfiguration:{subnets:($subnets|split(",")),securityGroups:($groups|split(",")),assignPublicIp:"DISABLED"}}')
          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json "file://$API_TASK_DEFINITION" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          overrides=$(jq -cn \
            '{containerOverrides:[{name:"api",command:["alembic","-c","alembic.ini","upgrade","head"]}]}')
          task_response=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$task_definition_arn" \
            --network-configuration "$network_configuration" \
            --overrides "$overrides" \
            --output json)
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<< "$task_response")
          if [[ -z "$task_arn" ]]; then
            jq '.failures' <<< "$task_response"
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' \
            --output text)
          if [[ "$exit_code" != "0" ]]; then
            echo "Database migration task failed with exit code: $exit_code"
            exit 1
          fi

      - name: Render worker task definition
        id: worker-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/worker-task-definition.json
          container-name: worker
          image: ${{ steps.aws-account.outputs.registry }}/esakip-api:${{ env.IMAGE_TAG }}

      - name: Deploy worker to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: esakip-worker-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Deploy API to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: esakip-api-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Render frontend task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/frontend-task-definition.json
          container-name: frontend
          image: ${{ steps.aws-account.outputs.registry }}/esakip-frontend:${{ env.IMAGE_TAG }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: esakip-frontend-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 5

      - name: Verify API health endpoint
        if: ${{ vars.PUBLIC_API_URL != '' }}
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: curl --fail --retry 5 --retry-delay 10 "$PUBLIC_API_URL/ready"
